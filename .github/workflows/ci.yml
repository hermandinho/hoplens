name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Lint
        run: pnpm lint

      # Build first: typecheck resolves workspace packages (e.g. @hoplens/schema) through their dist
      # .d.ts, so typechecking against a missing or half-written dist races.
      - name: Build packages
        run: pnpm -r --filter "./packages/*" run build

      - name: Typecheck
        run: pnpm -r --parallel run typecheck

      - name: Test
        run: pnpm -r --parallel run test

      # Overhead budget (< 2 ms per request, AGENTS.md). Run on its own, after the parallel tests, so
      # CPU contention can't fail it. Linux only: the shared Windows runners are too noisy for a timing gate.
      - name: Bench (core)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @hoplens/core bench

      - name: Bench (next)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @hoplens/next bench

  # Function hops and the request path across the runner setups (packages/express/README.md, runner
  # table) on the engines floor and the current 22 / 24 lines. vitest, pnpm and the build run on a fixed
  # Node 22; the spawned app processes run on the matrix Node (HOPLENS_TEST_NODE, see
  # packages/express/test/test-node.ts), so the floor is tested without the toolchain having to run on it.
  # Rows a Node cannot run (type stripping on 20.9) skip with the reason in the test title.
  runner-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20.9.0, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Node under test (${{ matrix.node }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Remember it as HOPLENS_TEST_NODE
        shell: bash
        run: |
          node -v
          echo "HOPLENS_TEST_NODE=$(node -p process.execPath)" >> "$GITHUB_ENV"

      - name: Toolchain Node (22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Build packages
        run: pnpm -r --filter "./packages/*" run build

      - name: Runner matrix (transform)
        run: pnpm --filter @hoplens/transform run test:runners

      - name: Runner matrix (express)
        run: pnpm --filter @hoplens/express run test:runners

  integration:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Build packages
        run: pnpm -r --filter "./packages/*" run build

      # Hoplens must not ship anything into the production server bundle.
      - name: Verify dev-only build
        run: pnpm --filter hoplens-e2e verify:build

      # Simulate npm i -D hoplens end-to-end: pack → scratch project → init → doctor.
      - name: Verify install flow
        run: pnpm --filter hoplens-e2e verify:install
