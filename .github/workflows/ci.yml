name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Lint
        run: pnpm lint

      - name: Build packages
        run: pnpm -r --filter "./packages/*" run build

      - name: Typecheck
        run: pnpm -r --parallel run typecheck

      - name: Test
        run: pnpm -r --parallel run test

  integration:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Build packages
        run: pnpm -r --filter "./packages/*" run build

      # Hoplens must not ship anything into the production server bundle.
      - name: Verify dev-only build
        run: pnpm --filter hoplens-e2e verify:build

      # Simulate npm i -D hoplens end-to-end: pack → scratch project → init → doctor.
      - name: Verify install flow
        run: pnpm --filter hoplens-e2e verify:install
